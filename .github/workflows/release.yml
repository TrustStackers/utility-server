name: Release

# Tags are the release trigger and the source of truth. Pushing `vX.Y.Z`
# creates a GitHub Release with generated notes.
#
# There is no npm publish step. If you start publishing container images, add
# the build here and tag the image `X.Y.Z`, `X.Y` and `sha-<short>` — immutable,
# digest-pinned, with a provenance attestation (`--attest type=provenance,mode=max`).
#
# Cut a release:
#   npm version <patch|minor|major>     # bumps package.json, commits, tags
#   git push origin main --follow-tags
#
# The running server should report its version: see `/version` (planned) —
# built from `git describe --tags` plus the core/app-api versions, with
# SCHEMA_VERSION, so an agent and a server can detect schema skew at startup.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generated notes need the previous tag

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
