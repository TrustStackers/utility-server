# Local YugabyteDB for P2PTS utility server development.
#
# Start:        docker compose up -d
# Status:       docker compose ps
# Logs:         docker compose logs -f
# Stop:         docker compose stop          (preserves data)
# Nuke:         docker compose down -v       (deletes all data)
#
# YSQL:         localhost:5433
# Master UI:    http://localhost:7000

services:
  yugabyte:
    image: yugabytedb/yugabyte:latest
    ports:
      - "5433:5433"    # YSQL (PostgreSQL wire protocol)
      - "7001:7000"    # Master UI (cluster dashboard) — mapped to 7001 to avoid port conflict
      - "15433:15433"  # YSQL load balancer port (for multi-node)
    command: bin/yugabyted start --daemon=false
    environment:
      - YSQL_PORT=5433
    volumes:
      - yb-data:/root/var/data
    healthcheck:
      # yugabyted binds YSQL to the container's eth0 IP (not loopback), so the
      # check must target the container hostname rather than default localhost.
      test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname) -c 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  yb-data: